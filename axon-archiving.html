<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXON — الأرشفة</title>
<style>
  :root{
    --ink:#0f1420; --ink-2:#161d2e; --ink-3:#232c42;
    --slate:#8a93a8; --white:#e8ebf3; --gold:#c9a15a; --green:#3fa66f; --err:#e07a6b;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--white);font-family:'Segoe UI',Tahoma,Arial,sans-serif;padding:20px 14px 80px;}
  h1{text-align:center;font-size:1.3rem;margin:0 0 6px;}
  h2{font-size:1.05rem;margin:28px auto 10px;max-width:600px;color:var(--gold);}
  .card{background:var(--ink-2);border:1px solid var(--ink-3);border-radius:10px;padding:16px;margin-bottom:16px;max-width:600px;margin-left:auto;margin-right:auto;}
  label{display:block;font-size:0.82rem;color:var(--slate);margin-bottom:6px;}
  input, textarea, select{
    width:100%;padding:10px;border-radius:8px;border:1px solid var(--ink-3);
    background:var(--ink);color:var(--white);font-size:0.95rem;margin-bottom:14px;
  }
  .mode-switch{display:flex;gap:8px;max-width:600px;margin:0 auto 16px;}
  .mode-btn{
    flex:1;padding:12px;border-radius:8px;border:1px solid var(--ink-3);
    background:var(--ink-2);color:var(--slate);font-size:0.9rem;cursor:pointer;text-align:center;
  }
  .mode-btn.active{background:var(--gold);color:#14171c;border-color:var(--gold);font-weight:600;}
  .photo-box{
    border:2px dashed var(--gold);border-radius:10px;padding:20px;text-align:center;
    cursor:pointer;margin-bottom:14px;
  }
  .photo-box img{max-width:100%;border-radius:8px;margin-top:10px;}
  .archiver-box{
    background:var(--ink-3);border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:0.85rem;
  }
  .archiver-box b{color:var(--gold);}
  .fp-btn{
    width:100%;padding:14px;border:none;border-radius:8px;
    background:linear-gradient(135deg,#3b6fd6,#5a8ef0);color:#fff;
    font-size:1rem;font-weight:600;cursor:pointer;
  }
  .fp-btn:disabled{opacity:0.5;}
  .msg{text-align:center;padding:12px;border-radius:8px;margin-top:12px;font-size:0.9rem;display:none;}
  .msg.ok{display:block;background:rgba(63,166,111,.15);color:#7bd6a4;}
  .msg.err{display:block;background:rgba(224,122,107,.15);color:var(--err);}
  .confirm-box{
    background:var(--ink-3);border-radius:8px;padding:14px;margin-top:14px;font-size:0.85rem;line-height:1.8;
  }
  .archive-item{background:var(--ink-2);border:1px solid var(--ink-3);border-radius:10px;padding:14px;margin-bottom:12px;max-width:600px;margin-left:auto;margin-right:auto;font-size:0.9rem;}
  .archive-item .head{display:flex;justify-content:space-between;font-weight:600;margin-bottom:6px;}
  .archive-item .meta{color:var(--slate);font-size:0.82rem;margin-bottom:8px;}
  .archive-item a, .archive-item span.act{color:#5b9bd5;margin-inline-end:16px;cursor:pointer;}
  .archive-item table{width:100%;border-collapse:collapse;margin-top:8px;}
  .archive-item th, .archive-item td{padding:6px;border-bottom:1px solid var(--ink-3);text-align:right;font-size:0.82rem;}
  .archive-item th{color:var(--slate);}
  .account-name{text-align:center;color:var(--slate);margin-bottom:20px;}
  .item-row{
    display:grid;grid-template-columns:1fr;gap:6px;
    margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--ink-3);
  }
  .item-row-bottom{
    display:grid;grid-template-columns:1fr 1fr 1fr 34px;gap:6px;align-items:center;
  }
  .item-row-bottom input{margin-bottom:0;padding:8px 6px;font-size:0.85rem;}
  .item-row .line-total{font-size:0.8rem;color:var(--green);text-align:center;}
  .remove-btn{background:none;border:none;color:var(--err);font-size:1.2rem;cursor:pointer;width:34px;height:34px;}
  .add-btn{
    background:var(--ink-3);color:var(--gold);border:1px dashed var(--gold);
    border-radius:8px;padding:10px;width:100%;font-size:0.9rem;cursor:pointer;margin-top:4px;
  }
  .total-box{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--ink-3);border-radius:8px;padding:12px 14px;margin-top:14px;font-size:1rem;
  }
  .total-box b{color:var(--gold);}
  .col-labels{
    display:grid;grid-template-columns:1fr 70px 70px 80px 34px;gap:6px;
    font-size:0.72rem;color:var(--slate);margin-bottom:6px;
  }
</style>
</head>
<body>

<h1>AXON — الأرشفة</h1>
<div class="account-name" id="accountNameLabel">جاري التحميل...</div>

<div class="card">
  <div class="archiver-box">
    المؤرشف الحالي: <b id="archiverName">جاري التحميل...</b>
  </div>
</div>

<div class="mode-switch">
  <button class="mode-btn active" id="modePhotoBtn">📷 أرشفة بالصورة</button>
  <button class="mode-btn" id="modeFormBtn">📝 استمارة يدوية</button>
</div>

<div class="card" id="photoModeCard">
  <label>صورة الفاتورة / الوثيقة</label>
  <div class="photo-box" id="photoBox">
    <span id="photoLabel">اضغط هنا لالتقاط أو اختيار صورة</span>
    <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">
    <img id="photoPreview" style="display:none">
  </div>

  <label>ملاحظة (اختياري)</label>
  <textarea id="noteInput" rows="2" placeholder="مثال: فاتورة مواد غذائية شهر 09"></textarea>

  <button class="fp-btn" id="confirmBtn">🔒 تأكيد الأرشفة ببصمة اليد</button>
  <div class="msg" id="msgBox"></div>
</div>

<div class="card" id="formModeCard" style="display:none;">
  <label>رقم الفاتورة</label>
  <input type="text" id="invoiceNumber" placeholder="مثال: F-2026-045">

  <div class="col-labels">
    <div>اسم المادة</div><div>الوزن/الكمية</div><div>سعر الوحدة</div><div>الإجمالي</div><div></div>
  </div>
  <div id="itemsContainer"></div>
  <button class="add-btn" id="addItemBtn" type="button">+ إضافة مادة جديدة</button>

  <div class="total-box">
    <span>الإجمالي الكلي للفاتورة</span>
    <b id="grandTotal">0</b>
  </div>

  <button class="fp-btn" id="confirmFormBtn" style="margin-top:14px;">🔒 تأكيد الأرشفة ببصمة اليد</button>
  <div class="msg" id="msgFormBox"></div>
</div>

<h2>الأرشيف</h2>
<div id="archiveList">جاري التحميل...</div>

<script src="https://cdn.jsdelivr.net/npm/@simplewebauthn/browser@10/dist/bundle/index.umd.min.js"></script>
<script>
function downloadPhoto(url){
  fetch(url).then(function(r){ return r.blob(); }).then(function(blob){
    var objUrl = (self.URL || self.webkitURL).createObjectURL(blob);
    var link = document.createElement('a');
    link.href = objUrl;
    link.download = 'وثيقة.jpg';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }).catch(function(e){ alert('تعذر التحميل: ' + e.message); });
}
function printInvoice(invNumber, archiverNm, dateStr, itemsHtml, totalVal){
  var win = window.open('', '_blank');
  win.document.write(`
    <html dir="rtl" lang="ar"><head><meta charset="UTF-8">
    <style>
      body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;padding:30px;color:#14171c;}
      h1{text-align:center;font-size:1.4rem;margin-bottom:4px;}
      .sub{text-align:center;color:#7d8493;margin-bottom:24px;}
      table{width:100%;border-collapse:collapse;margin-bottom:20px;}
      th,td{padding:8px;border:1px solid #ccc;text-align:right;}
      th{background:#f0f0f0;}
      .total{font-size:1.1rem;font-weight:bold;text-align:left;margin-bottom:24px;}
      .footer{border-top:1px solid #ccc;padding-top:14px;font-size:0.85rem;color:#555;}
    </style></head><body>
    <h1>AXON — فاتورة رقم ${invNumber}</h1>
    <div class="sub">التاريخ: ${dateStr}</div>
    <table><tr><th>المادة</th><th>الوزن/الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th></tr>
      ${itemsHtml}
    </table>
    <div class="total">الإجمالي الكلي: ${totalVal}</div>
    <div class="footer">
      المؤرشف: ${archiverNm}<br>
      موثق ببصمة اليد — لا يمكن التعديل أو الحذف
    </div>
    <script>window.onload=function(){window.print();}<\/script>
    </body></html>
  `);
  win.document.close();
}
function printPhoto(url){
  var win = window.open('', '_blank');
  win.document.write('<img src="' + url + '" style="max-width:100%" onload="window.print()">');
  win.document.close();
}
function downloadInvoice(invNumber, archiverNm, dateStr, itemsHtml, totalVal){
  var htmlContent = `<html dir="rtl" lang="ar"><head><meta charset="UTF-8">
    <style>
      body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;padding:30px;color:#14171c;}
      h1{text-align:center;font-size:1.4rem;margin-bottom:4px;}
      .sub{text-align:center;color:#7d8493;margin-bottom:24px;}
      table{width:100%;border-collapse:collapse;margin-bottom:20px;}
      th,td{padding:8px;border:1px solid #ccc;text-align:right;}
      th{background:#f0f0f0;}
      .total{font-size:1.1rem;font-weight:bold;text-align:left;margin-bottom:24px;}
      .footer{border-top:1px solid #ccc;padding-top:14px;font-size:0.85rem;color:#555;}
    </style></head><body>
    <h1>AXON — فاتورة رقم ${invNumber}</h1>
    <div class="sub">التاريخ: ${dateStr}</div>
    <table><tr><th>المادة</th><th>الوزن/الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th></tr>
      ${itemsHtml}
    </table>
    <div class="total">الإجمالي الكلي: ${totalVal}</div>
    <div class="footer">
      المؤرشف: ${archiverNm}<br>
      موثق ببصمة اليد — لا يمكن التعديل أو الحذف
    </div>
    </body></html>`;
  var blob = new Blob([htmlContent], { type: 'text/html' });
  var objUrl = (self.URL || self.webkitURL).createObjectURL(blob);
  var link = document.createElement('a');
  link.href = objUrl;
  link.download = 'فاتورة-' + invNumber + '.html';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
const SUPABASE_URL = "https://tmizzjieyeqbcxuxoucw.supabase.co";
const ANON_KEY = "sb_publishable_0MXFCqGL0eqkteVozjLtDQ_VCmGeXhM";

const REAL_SLUGS = {
  "get-user-context": "bright-handler",
  "login-biometric-options": "smart-endpoint",
  "login-biometric-verify": "rapid-api"
};
function fn(name){
  const slug = REAL_SLUGS[name] || name;
  return `${SUPABASE_URL}/functions/v1/${slug}`;
}
function headers(){
  return {
    "Content-Type": "application/json",
    "Authorization": `Bearer ${ANON_KEY}`,
    "apikey": ANON_KEY
  };
}

const params = new URLSearchParams(window.location.search);
const userId = params.get('uid') || sessionStorage.getItem('axon_user_id');
const accountId = params.get('id');

if(!userId){
  window.location.href = "axon-portal.html";
}
if(!accountId){
  document.getElementById('accountNameLabel').textContent = 'خطأ: لم يتم تحديد الحساب.';
}

let currentUserEmail = null;
let selectedFile = null;

document.getElementById('modePhotoBtn').addEventListener('click', function(){
  this.classList.add('active');
  document.getElementById('modeFormBtn').classList.remove('active');
  document.getElementById('photoModeCard').style.display = 'block';
  document.getElementById('formModeCard').style.display = 'none';
});
document.getElementById('modeFormBtn').addEventListener('click', function(){
  this.classList.add('active');
  document.getElementById('modePhotoBtn').classList.remove('active');
  document.getElementById('formModeCard').style.display = 'block';
  document.getElementById('photoModeCard').style.display = 'none';
});

async function loadArchiverInfo(){
  try{
    const res = await fetch(fn('get-user-context'), {
      method:'POST', headers: headers(), body: JSON.stringify({ user_id: userId })
    });
    const data = await res.json();
    if(data.success){
      currentUserEmail = data.user.email;
      document.getElementById('archiverName').textContent = data.user.full_name || data.user.email;
    }
  }catch(e){
    document.getElementById('archiverName').textContent = 'تعذر التحميل';
  }
}
loadArchiverInfo();

async function loadAccountName(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/accounts?id=eq.${accountId}&select=name`, { headers: headers() });
    const data = await res.json();
    document.getElementById('accountNameLabel').textContent = (data[0] && data[0].name) || 'حساب غير معروف';
  }catch(e){
    document.getElementById('accountNameLabel').textContent = 'تعذر تحميل اسم الحساب';
  }
}
if(accountId) loadAccountName();

document.getElementById('photoBox').addEventListener('click', ()=>{
  document.getElementById('photoInput').click();
});

document.getElementById('photoInput').addEventListener('change', function(e){
  selectedFile = e.target.files[0];
  if(selectedFile){
    const reader = new FileReader();
    reader.onload = function(ev){
      document.getElementById('photoPreview').src = ev.target.result;
      document.getElementById('photoPreview').style.display = 'block';
      document.getElementById('photoLabel').textContent = 'اضغط لتغيير الصورة';
    };
    reader.readAsDataURL(selectedFile);
  }
});

async function doBiometricCheck(){
  if(!currentUserEmail){
    throw new Error('تعذر التعرف على المستخدم الحالي. سجّل الدخول من جديد.');
  }
  if(!window.PublicKeyCredential){
    throw new Error('هذا الجهاز/المتصفح لا يدعم البصمة (WebAuthn).');
  }
  const optRes = await fetch(fn('login-biometric-options'), {
    method:'POST', headers: headers(), body: JSON.stringify({ email: currentUserEmail })
  });
  const options = await optRes.json();
  if(options.error){ throw new Error(options.error); }

  const authResp = await SimpleWebAuthnBrowser.startAuthentication(options);

  const verifyRes = await fetch(fn('login-biometric-verify'), {
    method:'POST', headers: headers(),
    body: JSON.stringify({ user_id: userId, assertion_response: authResp })
  });
  const verifyData = await verifyRes.json();
  if(!verifyData.success){
    throw new Error(verifyData.error || 'فشل التحقق من البصمة.');
  }
}

document.getElementById('confirmBtn').addEventListener('click', async function(){
  const btn = this;
  const msgBox = document.getElementById('msgBox');
  msgBox.className = 'msg';

  const note = document.getElementById('noteInput').value.trim();

  if(!accountId){
    msgBox.className = 'msg err';
    msgBox.textContent = 'لم يتم تحديد الحساب.';
    return;
  }
  if(!selectedFile){
    msgBox.className = 'msg err';
    msgBox.textContent = 'أضف صورة الفاتورة أولاً.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'جاري التحقق من البصمة...';

  try{
    await doBiometricCheck();

    btn.textContent = 'جاري رفع الصورة...';
    const fileName = `${accountId}/${Date.now()}_${selectedFile.name}`;
    const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/invoice-photos/${fileName}`, {
      method:'POST',
      headers: { "Authorization": `Bearer ${ANON_KEY}`, "apikey": ANON_KEY, "Content-Type": selectedFile.type },
      body: selectedFile
    });
    if(!uploadRes.ok){
      const errText = await uploadRes.text();
      throw new Error('فشل رفع الصورة: ' + uploadRes.status + ' - ' + errText);
    }

    const insertRes = await fetch(`${SUPABASE_URL}/rest/v1/photo_archive`, {
      method:'POST',
      headers: { ...headers(), "Prefer": "return=representation" },
      body: JSON.stringify({
        account_id: accountId,
        archived_by: userId,
        image_path: fileName,
        note: note || null
      })
    });
    const insertData = await insertRes.json();
    if(!Array.isArray(insertData) || insertData.length === 0){
      throw new Error('فشل تسجيل الأرشفة.');
    }

    const savedAt = new Date(insertData[0].created_at);
    msgBox.className = 'msg ok';
    msgBox.innerHTML = `تمت الأرشفة بنجاح ✅
      <div class="confirm-box">
        المؤرشف: ${currentUserEmail}<br>
        الوقت: ${savedAt.toLocaleTimeString('ar')}<br>
        التاريخ: ${savedAt.toLocaleDateString('ar')}<br>
        لا يمكن تعديل أو حذف هذا السجل نهائيًا.
      </div>`;

    selectedFile = null;
    document.getElementById('photoPreview').style.display = 'none';
    document.getElementById('photoLabel').textContent = 'اضغط هنا لالتقاط أو اختيار صورة';
    document.getElementById('noteInput').value = '';

    loadArchiveList();

  }catch(e){
    msgBox.className = 'msg err';
    msgBox.textContent = 'خطأ: ' + e.message;
  }finally{
    btn.disabled = false;
    btn.textContent = '🔒 تأكيد الأرشفة ببصمة اليد';
  }
});

// ===== استمارة يدوية =====
let itemRowCount = 0;

function addItemRow(){
  itemRowCount++;
  const container = document.getElementById('itemsContainer');
  const row = document.createElement('div');
  row.className = 'item-row';
  row.dataset.rowId = itemRowCount;
  row.innerHTML = `
    <input type="text" class="item-name" placeholder="اسم المادة (مثال: بطاطا)">
    <div class="item-row-bottom">
      <input type="number" class="item-weight" placeholder="الوزن/الكمية" step="any">
      <input type="number" class="item-price" placeholder="سعر الوحدة" step="any">
      <div class="line-total">0</div>
      <button class="remove-btn" type="button">✕</button>
    </div>
  `;
  container.appendChild(row);

  const weightInput = row.querySelector('.item-weight');
  const priceInput = row.querySelector('.item-price');
  const totalDiv = row.querySelector('.line-total');
  const removeBtn = row.querySelector('.remove-btn');

  function recalcRow(){
    const w = parseFloat(weightInput.value) || 0;
    const p = parseFloat(priceInput.value) || 0;
    totalDiv.textContent = (w * p).toFixed(2);
    recalcGrandTotal();
  }
  weightInput.addEventListener('input', recalcRow);
  priceInput.addEventListener('input', recalcRow);
  removeBtn.addEventListener('click', function(){
    row.remove();
    recalcGrandTotal();
  });
}

function recalcGrandTotal(){
  let sum = 0;
  document.querySelectorAll('#itemsContainer .item-row').forEach(row=>{
    const w = parseFloat(row.querySelector('.item-weight').value) || 0;
    const p = parseFloat(row.querySelector('.item-price').value) || 0;
    sum += w * p;
  });
  document.getElementById('grandTotal').textContent = sum.toFixed(2);
}

document.getElementById('addItemBtn').addEventListener('click', addItemRow);
addItemRow();
addItemRow();

document.getElementById('confirmFormBtn').addEventListener('click', async function(){
  const btn = this;
  const msgBox = document.getElementById('msgFormBox');
  msgBox.className = 'msg';

  const invoiceNumber = document.getElementById('invoiceNumber').value.trim();

  if(!accountId){
    msgBox.className = 'msg err';
    msgBox.textContent = 'لم يتم تحديد الحساب.';
    return;
  }
  if(!invoiceNumber){
    msgBox.className = 'msg err';
    msgBox.textContent = 'أدخل رقم الفاتورة.';
    return;
  }

  const items = [];
  document.querySelectorAll('#itemsContainer .item-row').forEach(row=>{
    const name = row.querySelector('.item-name').value.trim();
    const weight = parseFloat(row.querySelector('.item-weight').value) || 0;
    const price = parseFloat(row.querySelector('.item-price').value) || 0;
    if(name && (weight > 0 || price > 0)){
      items.push({ item_name: name, weight: weight, unit_price: price, line_total: weight * price });
    }
  });

  if(items.length === 0){
    msgBox.className = 'msg err';
    msgBox.textContent = 'أضف مادة واحدة على الأقل بوزن أو سعر صحيح.';
    return;
  }

  const totalValue = items.reduce((sum, it) => sum + it.line_total, 0);

  btn.disabled = true;
  btn.textContent = 'جاري التحقق من البصمة...';

  try{
    await doBiometricCheck();

    btn.textContent = 'جاري الحفظ...';

    const invRes = await fetch(`${SUPABASE_URL}/rest/v1/invoices`, {
      method: 'POST',
      headers: { ...headers(), "Prefer": "return=representation" },
      body: JSON.stringify({
        account_id: accountId,
        invoice_number: invoiceNumber,
        archived_by: userId,
        total_value: totalValue
      })
    });
    const invData = await invRes.json();
    if(!Array.isArray(invData) || invData.length === 0){
      throw new Error('فشل إنشاء الفاتورة: ' + JSON.stringify(invData));
    }
    const invoiceId = invData[0].id;

    const itemsPayload = items.map(it => ({ ...it, invoice_id: invoiceId }));
    const itemsRes = await fetch(`${SUPABASE_URL}/rest/v1/invoice_items`, {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify(itemsPayload)
    });
    if(!itemsRes.ok){
      const errText = await itemsRes.text();
      throw new Error('فشل حفظ البنود: ' + errText);
    }

    msgBox.className = 'msg ok';
    msgBox.textContent = `تم حفظ الفاتورة بنجاح (${items.length} مادة، الإجمالي: ${totalValue.toFixed(2)}). لا يمكن التعديل عليها بعد الآن.`;

    document.getElementById('invoiceNumber').value = '';
    document.getElementById('itemsContainer').innerHTML = '';
    itemRowCount = 0;
    addItemRow();
    addItemRow();
    recalcGrandTotal();

    loadArchiveList();

  }catch(e){
    msgBox.className = 'msg err';
    msgBox.textContent = 'خطأ: ' + e.message;
  }finally{
    btn.disabled = false;
    btn.textContent = '🔒 تأكيد الأرشفة ببصمة اليد';
  }
});

function loadArchiveList(){
  const container = document.getElementById('archiveList');
  if(!accountId){ container.innerHTML = ''; return; }

  Promise.all([
    fetch(`${SUPABASE_URL}/rest/v1/users?select=id,full_name,email`, { headers: headers() }).then(r=>r.json()),
    fetch(`${SUPABASE_URL}/rest/v1/photo_archive?account_id=eq.${accountId}&select=*&order=created_at.desc`, { headers: headers() }).then(r=>r.json()),
    fetch(`${SUPABASE_URL}/rest/v1/invoices?account_id=eq.${accountId}&select=*,invoice_items(*)&order=archived_at.desc`, { headers: headers() }).then(r=>r.json())
  ]).then(([users, photos, invoices])=>{
    const userMap = {};
    users.forEach(u=>{ userMap[u.id] = u.full_name || u.email; });
const photoArr = Array.isArray(photos) ? photos.map(p=>({ ...p, _type:'photo' })) : [];
const invArr = Array.isArray(invoices) ? invoices.map(i=>({ ...i, _type:'invoice' })) : [];
const combined = [...photoArr, ...invArr].sort((a,b)=> new Date(b.created_at) - new Date(a.created_at));

if(combined.length === 0){
  container.innerHTML = 'لا توجد عناصر مؤرشفة بعد.';
  return;
}

    let html = '';
    const signPromises = [];

    combined.forEach((item, idx)=>{
      const archiverNm = userMap[item.archived_by] || item.archived_by;
      const date = (item.created_at || item.archived_at) ? new Date(item.created_at || item.archived_at).toLocaleString('ar') : '';

      if(item._type === 'photo'){
        html += `<div class="archive-item" id="archItem${idx}">`;
        html += `<div class="head"><span>📷 صورة</span><span>${date}</span></div>`;
        html += `<div class="meta">المؤرشف: ${archiverNm}${item.note ? ' — ' + item.note : ''}</div>`;
        html += `<div id="archAct${idx}">جاري تحميل الرابط...</div>`;
        html += `</div>`;

        const signPromise = fetch(`${SUPABASE_URL}/storage/v1/object/sign/invoice-photos/${item.image_path}`, {
          method:'POST', headers: headers(), body: JSON.stringify({ expiresIn: 3600 })
        }).then(r=>r.json()).then(signData=>({ idx, url: signData.signedURL }));
        signPromises.push(signPromise);
        } else {
          var itemsRowsHtml = '';
          (item.invoice_items || []).forEach(it=>{
            itemsRowsHtml += `<tr><td>${it.item_name}</td><td>${it.weight}</td><td>${it.unit_price}</td><td>${it.line_total}</td></tr>`;
          });
          var itemsRowsEscaped = itemsRowsHtml.replace(/'/g, "\\'");

          html += `<div class="archive-item">`;
          html += `<div class="head"><span>📝 فاتورة رقم ${item.invoice_number}</span><span>${date}</span></div>`;
          html += `<div class="meta">المؤرشف: ${archiverNm}</div>`;
          html += `<table><tr><th>المادة</th><th>الوزن/الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th></tr>`;
          html += itemsRowsHtml;
          html += `</table>`;
          html += `<div class="meta" style="margin-top:6px;">الإجمالي الكلي: ${item.total_value}</div>`;
          html += `<div><a href="javascript:void(0)" onclick='printInvoice("${item.invoice_number}", "${archiverNm}", "${date}", "${itemsRowsEscaped}", "${item.total_value}")'>عرض/طباعة</a><span class="act" onclick='downloadInvoice("${item.invoice_number}", "${archiverNm}", "${date}", "${itemsRowsEscaped}", "${item.total_value}")'>تحميل</span></div>`;
          html += `</div>`;
        }
    });

    container.innerHTML = html;

    Promise.all(signPromises).then(results=>{
      results.forEach(r=>{
        const el = document.getElementById('archAct' + r.idx);
        if(el){
          if(r.url){
            const fullUrl = SUPABASE_URL + "/storage/v1" + r.url;
            el.innerHTML = `<a href="${fullUrl}" target="_blank">عرض</a><span class="act" onclick='downloadPhoto("${fullUrl}")'>تحميل</span><span class="act" onclick='printPhoto("${fullUrl}")'>طباعة</span>`;
          } else {
            el.textContent = 'تعذر تحميل الرابط.';
          }
        }
      });
    });
  }).catch(e=>{
    container.innerHTML = 'تعذر تحميل الأرشيف: ' + e.message;
  });
}
loadArchiveList();
</script>

</body>
</html>
