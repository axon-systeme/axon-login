<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXON — استمارة فاتورة</title>
<style>
  :root{
    --ink:#0f1420; --ink-2:#161d2e; --ink-3:#232c42;
    --slate:#8a93a8; --white:#e8ebf3; --red:#c0392b;
    --gold:#c9a15a; --green:#3fa66f; --err:#e07a6b;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--white);font-family:'Segoe UI',Tahoma,Arial,sans-serif;padding:20px 14px 80px;}
  h1{text-align:center;font-size:1.35rem;margin:0 0 20px;}
  h1 span{color:var(--red);}
  .card{background:var(--ink-2);border:1px solid var(--ink-3);border-radius:10px;padding:16px;margin-bottom:16px;max-width:800px;margin-left:auto;margin-right:auto;}
  label{display:block;font-size:0.82rem;color:var(--slate);margin-bottom:5px;}
  input, select{
    width:100%;padding:10px;border-radius:8px;border:1px solid var(--ink-3);
    background:var(--ink);color:var(--white);font-size:0.95rem;margin-bottom:12px;
  }
  input:focus, select:focus{outline:none;border-color:var(--gold);}
  .items-header{
    display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;
  }
  .items-header h2{font-size:1rem;margin:0;color:var(--gold);}
  .item-row{
    display:grid;grid-template-columns:1fr;gap:6px;
    margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--ink-3);
  }
  .item-row .item-name{margin-bottom:0;}
  .item-row-bottom{
    display:grid;grid-template-columns:1fr 1fr 1fr 34px;gap:6px;align-items:center;
  }
  .item-row-bottom input{margin-bottom:0;padding:8px 6px;font-size:0.85rem;}
  .item-row .line-total{
    font-size:0.8rem;color:var(--green);text-align:center;
  }
  .remove-btn{
    background:none;border:none;color:var(--err);font-size:1.2rem;cursor:pointer;
    width:34px;height:34px;
  }
  .add-btn{
    background:var(--ink-3);color:var(--gold);border:1px dashed var(--gold);
    border-radius:8px;padding:10px;width:100%;font-size:0.9rem;cursor:pointer;margin-top:4px;
  }
  .total-box{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--ink-3);border-radius:8px;padding:12px 14px;margin-top:14px;font-size:1rem;
  }
  .total-box b{color:var(--gold);}
  .submit-btn{
    width:100%;padding:14px;border:none;border-radius:8px;
    background:linear-gradient(135deg,#3b6fd6,#5a8ef0);color:#fff;
    font-size:1rem;font-weight:600;cursor:pointer;margin-top:6px;
  }
  .submit-btn:disabled{opacity:0.6;}
  .msg{text-align:center;padding:12px;border-radius:8px;margin-top:12px;font-size:0.9rem;display:none;}
  .msg.ok{display:block;background:rgba(63,166,111,.15);color:#7bd6a4;}
  .msg.err{display:block;background:rgba(224,122,107,.15);color:var(--err);}
  .col-labels{
    display:grid;grid-template-columns:1fr 70px 70px 80px 34px;gap:6px;
    font-size:0.72rem;color:var(--slate);margin-bottom:6px;
  }
</style>
</head>
<body>

<h1>AXON — استمارة <span>فاتورة</span></h1>

<div class="card">
  <label>الحساب (الجهة)</label>
  <select id="accountSelect"><option value="">جاري تحميل الحسابات...</option></select>

  <label>رقم الفاتورة</label>
  <input type="text" id="invoiceNumber" placeholder="مثال: F-2026-045">

  <label>أمين المخزن / المسؤول عن الأرشفة</label>
  <select id="personSelect"><option value="">جاري تحميل الأشخاص...</option></select>
</div>

<div class="card">
  <div class="items-header">
    <h2>بنود الفاتورة</h2>
  </div>
  <div class="col-labels">
    <div>اسم المادة</div><div>الوزن/الكمية</div><div>سعر الوحدة</div><div>الإجمالي</div><div></div>
  </div>
  <div id="itemsContainer"></div>
  <button class="add-btn" id="addItemBtn">+ إضافة مادة جديدة</button>

  <div class="total-box">
    <span>الإجمالي الكلي للفاتورة</span>
    <b id="grandTotal">0</b>
  </div>
</div>

<div class="card">
  <button class="submit-btn" id="submitBtn">حفظ الفاتورة (أرشفة نهائية)</button>
  <div class="msg" id="msgBox"></div>
</div>

<script>
const SB_URL = "https://tmizzjieyeqbcxuxoucw.supabase.co";
const SB_KEY = "sb_publishable_0MXFCqGL0eqkteVozjLtDQ_VCmGeXhM";
const H = { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json" };

let itemRowCount = 0;

function addItemRow(){
  itemRowCount++;
  const container = document.getElementById('itemsContainer');
  const row = document.createElement('div');
  row.className = 'item-row';
  row.dataset.rowId = itemRowCount;
  row.innerHTML = `
    <input type="text" class="item-name" placeholder="اسم المادة (مثال: بطاطا)">
        <div class="item-row-bottom">
          <input type="number" class="item-weight" placeholder="الوزن/الكمية" step="any">
          <input type="number" class="item-price" placeholder="سعر الوحدة" step="any">
          <div class="line-total">0</div>
          <button class="remove-btn" type="button">✕</button>
        </div>
  `;
  container.appendChild(row);

  const weightInput = row.querySelector('.item-weight');
  const priceInput = row.querySelector('.item-price');
  const totalDiv = row.querySelector('.line-total');
  const removeBtn = row.querySelector('.remove-btn');

  function recalcRow(){
    const w = parseFloat(weightInput.value) || 0;
    const p = parseFloat(priceInput.value) || 0;
    const t = w * p;
    totalDiv.textContent = t.toFixed(2);
    recalcGrandTotal();
  }
  weightInput.addEventListener('input', recalcRow);
  priceInput.addEventListener('input', recalcRow);
  removeBtn.addEventListener('click', function(){
    row.remove();
    recalcGrandTotal();
  });
}

function recalcGrandTotal(){
  let sum = 0;
  document.querySelectorAll('.item-row').forEach(row=>{
    const w = parseFloat(row.querySelector('.item-weight').value) || 0;
    const p = parseFloat(row.querySelector('.item-price').value) || 0;
    sum += w * p;
  });
  document.getElementById('grandTotal').textContent = sum.toFixed(2);
}

document.getElementById('addItemBtn').addEventListener('click', addItemRow);
addItemRow();
addItemRow();

async function loadAccounts(){
  const sel = document.getElementById('accountSelect');
  try{
    const res = await fetch(`${SB_URL}/rest/v1/accounts?select=id,name`, { headers: H });
    const data = await res.json();
    sel.innerHTML = '<option value="">اختر الحساب...</option>';
    data.forEach(a=>{
      const opt = document.createElement('option');
      opt.value = a.id;
      opt.textContent = a.name;
      sel.appendChild(opt);
    });
  }catch(e){
    sel.innerHTML = '<option value="">تعذر التحميل</option>';
  }
}

async function loadPersons(){
  const sel = document.getElementById('personSelect');
  try{
    const res = await fetch(`${SB_URL}/rest/v1/persons?select=id,full_name&role=eq.cafeteria_manager`, { headers: H });
    let data = await res.json();
    if(data.length === 0){
      const res2 = await fetch(`${SB_URL}/rest/v1/persons?select=id,full_name`, { headers: H });
      data = await res2.json();
    }
    sel.innerHTML = '<option value="">اختر الشخص...</option>';
    data.forEach(p=>{
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = p.full_name;
      sel.appendChild(opt);
    });
  }catch(e){
    sel.innerHTML = '<option value="">تعذر التحميل</option>';
  }
}

loadAccounts();
loadPersons();

document.getElementById('submitBtn').addEventListener('click', async function(){
  const btn = this;
  const msgBox = document.getElementById('msgBox');
  msgBox.className = 'msg';

  const accountId = document.getElementById('accountSelect').value;
  const invoiceNumber = document.getElementById('invoiceNumber').value.trim();
  const personId = document.getElementById('personSelect').value;

  if(!accountId || !invoiceNumber || !personId){
    msgBox.className = 'msg err';
    msgBox.textContent = 'أكمل كل الحقول: الحساب، رقم الفاتورة، والمسؤول عن الأرشفة.';
    return;
  }

  const items = [];
  document.querySelectorAll('.item-row').forEach(row=>{
    const name = row.querySelector('.item-name').value.trim();
    const weight = parseFloat(row.querySelector('.item-weight').value) || 0;
    const price = parseFloat(row.querySelector('.item-price').value) || 0;
    if(name && (weight > 0 || price > 0)){
      items.push({ item_name: name, weight: weight, unit_price: price, line_total: weight * price });
    }
  });

  if(items.length === 0){
    msgBox.className = 'msg err';
    msgBox.textContent = 'أضف مادة واحدة على الأقل بوزن أو سعر صحيح.';
    return;
  }

  const totalValue = items.reduce((sum, it) => sum + it.line_total, 0);

  btn.disabled = true;
  btn.textContent = 'جاري الحفظ...';

  try{
    const invRes = await fetch(`${SB_URL}/rest/v1/invoices`, {
      method: 'POST',
      headers: { ...H, "Prefer": "return=representation" },
      body: JSON.stringify({
        account_id: accountId,
        invoice_number: invoiceNumber,
        archived_by: personId,
        total_value: totalValue
      })
    });
    const invData = await invRes.json();
    if(!Array.isArray(invData) || invData.length === 0){
      throw new Error('فشل إنشاء الفاتورة: ' + JSON.stringify(invData));
    }
    const invoiceId = invData[0].id;

    const itemsPayload = items.map(it => ({ ...it, invoice_id: invoiceId }));
    const itemsRes = await fetch(`${SB_URL}/rest/v1/invoice_items`, {
      method: 'POST',
      headers: H,
      body: JSON.stringify(itemsPayload)
    });
    if(!itemsRes.ok){
      const errText = await itemsRes.text();
      throw new Error('فشل حفظ البنود: ' + errText);
    }

    msgBox.className = 'msg ok';
    msgBox.textContent = `تم حفظ الفاتورة بنجاح (${items.length} مادة، الإجمالي: ${totalValue.toFixed(2)}). لا يمكن التعديل عليها بعد الآن.`;

    document.getElementById('invoiceNumber').value = '';
    document.getElementById('itemsContainer').innerHTML = '';
    itemRowCount = 0;
    addItemRow();
    addItemRow();
    recalcGrandTotal();

  }catch(e){
    msgBox.className = 'msg err';
    msgBox.textContent = 'خطأ: ' + e.message;
  }finally{
    btn.disabled = false;
    btn.textContent = 'حفظ الفاتورة (أرشفة نهائية)';
  }
});
</script>

</body>
</html>
