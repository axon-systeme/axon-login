<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXON — عرض الأقسام والتلاميذ</title>
<style>
  :root{
    --ink:#0f1420;
    --ink-2:#161d2e;
    --ink-3:#232c42;
    --slate:#8a93a8;
    --white:#e8ebf3;
    --red:#c0392b;
    --blue:#3b6fd6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--white);
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    padding:24px 16px 60px;
  }
  header{
    text-align:center;
    margin-bottom:32px;
  }
  header h1{
    font-size:1.5rem;
    margin:0 0 4px;
    letter-spacing:1px;
  }
  header h1 span{ color:var(--red); }
  header p{
    color:var(--slate);
    font-size:0.9rem;
    margin:0;
  }
  .wrap{
    max-width:900px;
    margin:0 auto;
  }
  .card{
    background:var(--ink-2);
    border:1px solid var(--ink-3);
    border-radius:10px;
    padding:18px;
    margin-bottom:20px;
  }
  .card h2{
    font-size:1.05rem;
    margin:0 0 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .count{
    background:var(--ink-3);
    color:var(--blue);
    font-size:0.85rem;
    padding:2px 10px;
    border-radius:999px;
  }
  table{
    width:100%;
    border-collapse:collapse;
    font-size:0.9rem;
  }
  th, td{
    text-align:right;
    padding:10px 8px;
    border-bottom:1px solid var(--ink-3);
  }
  th{
    color:var(--slate);
    font-weight:600;
    font-size:0.8rem;
  }
  tr:last-child td{ border-bottom:none; }
  .msg{
    text-align:center;
    color:var(--slate);
    padding:20px;
    font-size:0.9rem;
  }
  .err{ color:#e07a6b; }
</style>
</head>
<body>

  <header>
    <h1>AXON — <span>لوحة تجريبية</span></h1>
    <p>عرض الأقسام والتلاميذ (بيانات تجريبية)</p>
  </header>

  <div class="wrap">

    <div class="card">
      <h2>الأقسام <span class="count" id="sectionsCount">—</span></h2>
      <div id="sectionsBox"><div class="msg">جاري التحميل...</div></div>
    </div>

    <div class="card">
      <h2>التلاميذ <span class="count" id="personsCount">—</span></h2>
      <div id="personsBox"><div class="msg">جاري التحميل...</div></div>
    </div>

  </div>

<script>
const SUPABASE_URL = "https://tmizzjieyeqbcxuxoucw.supabase.co";
const ANON_KEY = "sb_publishable_0MXFCqGL0eqkteVozjLtDQ_VCmGeXhM";

function headers(){
  return {
    "Content-Type": "application/json",
    "apikey": ANON_KEY
  };
}

async function loadSections(){
  const box = document.getElementById('sectionsBox');
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/sections?select=*`, { headers: headers() });
    const data = await res.json();
  if(!Array.isArray(data)){
      box.innerHTML = `<div class="msg err">تعذر جلب البيانات: ${data.message || res.status}<br><small>${data.hint || data.code || ''}</small></div>`;
      return;
    }  
    document.getElementById('sectionsCount').textContent = data.length;
    if(data.length === 0){
      box.innerHTML = `<div class="msg">لا توجد أقسام بعد.</div>`;
      return;
    }
    let html = `<table><thead><tr>
      <th>القسم</th><th>الأستاذ</th><th>عدد التلاميذ</th>
    </tr></thead><tbody>`;
    data.forEach(s=>{
      html += `<tr>
        <td>${s.name || '—'}</td>
        <td>${s.teacher_name || '—'}</td>
        <td>${s.student_count ?? '—'}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
    box.innerHTML = html;
  }catch(e){
    box.innerHTML = `<div class="msg err">خطأ: ${e.message}</div>`;
  }
}

async function loadPersons(){
  const box = document.getElementById('personsBox');
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/persons?select=full_name,role,sections(name)`, { headers: headers() });
    const data = await res.json();
    if(!Array.isArray(data)){
      box.innerHTML = `<div class="msg err">تعذر جلب البيانات: ${data.message || res.status}<br><small>${data.hint || data.code || ''}</small></div>`;
      return;
    }
    document.getElementById('personsCount').textContent = data.length;
    if(data.length === 0){
      box.innerHTML = `<div class="msg">لا يوجد تلاميذ بعد.</div>`;
      return;
    }
    let html = `<table><thead><tr>
      <th>الاسم</th><th>الصفة</th><th>القسم</th>
    </tr></thead><tbody>`;
    data.forEach(p=>{
      html += `<tr>
        <td>${p.full_name || '—'}</td>
        <td>${p.role || '—'}</td>
        <td>${p.sections ? p.sections.name : '—'}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
    box.innerHTML = html;
  }catch(e){
    box.innerHTML = `<div class="msg err">خطأ: ${e.message}</div>`;
  }
}

loadSections();
loadPersons();
</script>

</body>
</html>
