<style>
  :root{
    --ink:#14171c; --ink-2:#1b1f26; --ink-3:#232833;
    --brass:#b08d57; --brass-bright:#d4ac6e;
    --paper:#ece7dc; --slate:#7d8493;
    --ok:#5c9179; --err:#b0654f; --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(1200px 800px at 50% -10%, #1e2430 0%, var(--ink) 55%), var(--ink);
    color:var(--paper); font-family:'IBM Plex Sans Arabic', sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px 16px; -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:420px; width:100%; }
  .brand{ text-align:center; margin-bottom:20px; }
  .brand h1{ font-family:'Zilla Slab', serif; font-weight:700; font-size:2rem; }
  .brand h1 span{ color:var(--brass-bright); }
  .brand p{ color:var(--paper); font-size:0.95rem; font-weight:600; margin-top:6px; }

  .tabs{ display:flex; gap:6px; margin-bottom:14px; background:var(--ink-2); border:1px solid var(--ink-3); border-radius:10px; padding:4px; }
  .tab{
    flex:1; text-align:center; padding:9px 4px; font-size:0.8rem; border-radius:7px;
    cursor:pointer; color:var(--slate); font-family:inherit;
  }
  .tab.active{ background:var(--ink-3); color:var(--paper); font-weight:600; }

  .card{
    background:var(--ink-2); border:1px solid var(--ink-3); border-radius:var(--radius);
    padding:24px; box-shadow:0 12px 30px -18px rgba(0,0,0,.5);
  }
  .step-title{ font-family:'Zilla Slab', serif; font-size:1.15rem; margin-bottom:4px; }
  .step-sub{ font-size:0.82rem; color:var(--slate); margin-bottom:18px; }

  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:0.8rem; margin-bottom:6px; color:var(--slate); }
  .field input{
    width:100%; background:var(--ink); border:1px solid var(--ink-3); border-radius:9px;
    padding:11px 12px; color:var(--paper); font-family:inherit; font-size:0.92rem;
  }
  .field input:focus{ outline:none; border-color:var(--brass); }

  .btn{
    width:100%; padding:12px; border-radius:9px; border:none; font-weight:600;
    font-family:inherit; font-size:0.92rem; cursor:pointer; margin-top:6px;
    background:linear-gradient(135deg, #1a5fb4, #4a9eff); color:#fff;
  }
  .btn:disabled{ opacity:0.6; }
  .btn.ghost{ background:none; border:1px solid var(--ink-3); color:var(--slate); }
  .btn:active{ transform:scale(.98); }

  .msg{ margin-top:12px; font-size:0.8rem; padding:9px 11px; border-radius:8px; display:none; }
  .msg.show{ display:block; }
  .msg.ok{ background:rgba(92,145,121,.15); color:#9fd2b8; }
  .msg.err{ background:rgba(120,132,147,.15); color:var(--slate); }

  .panel{ display:none; }
  .panel.active{ display:block; }

  .qr-box{ text-align:center; background:var(--ink); border:1px dashed var(--ink-3); border-radius:10px; padding:20px; }
  .qr-token{ font-family:monospace; font-size:0.95rem; letter-spacing:2px; margin:8px 0; word-break:break-all; }
  .qr-timer{ font-size:0.75rem; color:var(--slate); }

  .success{ text-align:center; }
  .success .icon{ font-size:2.4rem; margin-bottom:10px; }

  .footer-note{ text-align:center; font-size:0.72rem; color:var(--slate); margin-top:16px; }
  .axon-chat-wrap{
  position:fixed; bottom:16px; left:24px; z-index:1000;
  display:flex; flex-direction:column; align-items:center; gap:6px;
}
.axon-chat-label{
  font-family:'Zilla Slab',serif; font-size:0.75rem; font-weight:700;
  color:#4a9eff; text-shadow:0 0 8px rgba(66,150,255,.6);
  letter-spacing:1px;
}
.axon-chat-fab{
  width:64px; height:64px; border-radius:50%;
  background:#0a0e27; border:none; cursor:pointer; padding:0;
  overflow:hidden; animation:axonPulse 2.4s infinite;
}
.axon-chat-fab img{
  width:100%; height:100%; object-fit:cover;
}
@keyframes axonPulse{
  0%{ box-shadow:0 4px 20px rgba(66,150,255,.5), 0 0 0 0 rgba(66,150,255,.6); }
  70%{ box-shadow:0 4px 20px rgba(66,150,255,.5), 0 0 0 16px rgba(66,150,255,0); }
  100%{ box-shadow:0 4px 20px rgba(66,150,255,.5), 0 0 0 0 rgba(66,150,255,0); }
}
.axon-chat-panel{
  position:fixed; bottom:96px; left:24px; z-index:1000;
  width:320px; max-height:440px; background:var(--ink-2);
  border:1px solid var(--ink-3); border-radius:14px;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
  display:none; flex-direction:column; overflow:hidden;
}
.axon-chat-panel.open{ display:flex; }
.axon-chat-header{
      background:linear-gradient(135deg, #0d2b52, #1a5fb4);
      color:#fff; padding:12px 16px; font-weight:700; font-family:'Zilla Slab',serif;
      display:flex; justify-content:space-between; align-items:center;
    }
    .axon-chat-header button{ background:none; border:none; font-size:1.1rem; cursor:pointer; color:#fff; }
    .axon-chat-body{
      padding:14px; overflow-y:auto; flex:1; font-size:0.85rem;
      display:flex; flex-direction:column; gap:10px;
      background:#eef1f5;
    }
    .axon-chat-msg{
      background:linear-gradient(180deg, #0d2b52, #2a6fc9);
      border:none; border-radius:14px 14px 14px 4px;
      padding:10px 14px; line-height:1.5; color:#ffffff;
      max-width:80%; align-self:flex-start;
    }
    .axon-chat-msg.user{
      background:linear-gradient(180deg, #1a5fb4, #4a9eff);
      color:#fff; border:none;
      border-radius:14px 14px 4px 14px; align-self:flex-end;
    }
    .axon-chat-options{ display:flex; flex-direction:column; gap:8px; align-items:flex-end; width:100%; }
    .axon-chat-opt{
      background:#ffffff; border:1px solid #4a9eff; color:#1a5fb4;
      border-radius:10px; padding:9px 14px; font-size:0.8rem; cursor:pointer;
      font-family:inherit; text-align:right; max-width:85%;
    }
    .axon-chat-opt:hover{ background:#4a9eff; color:#fff; }
</style>

<script>
const SUPABASE_URL = "https://tmizzjieyeqbcxuxoucw.supabase.co";
const ANON_KEY = "sb_publishable_0MXFCqGL0eqkteVozjLtDQ_VCmGeXhM";

const REAL_SLUGS = {
  "login-password": "rapid-responder",
  "login-biometric-options": "smart-endpoint",
  "login-biometric-verify": "rapid-api",
  "login-qr-generate": "hyper-responder",
  "qr-login-confirm": "smooth-service",
  "qr-login-status": "smooth-action",
};
 function t(key){
  const lang = localStorage.getItem('axon_lang') || 'ar';
  return (translations[lang] && translations[lang][key]) || key;
}
function fn(name){
  const slug = REAL_SLUGS[name] || name;
  return `${SUPABASE_URL}/functions/v1/${slug}`;
}
function headers(){
  return {
    "Content-Type": "application/json",
    "Authorization": `Bearer ${ANON_KEY}`,
    "apikey": ANON_KEY
  };
}

function showMsg(id, text, type){
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg show ' + type;
}

function showPanel(id){
  document.querySelectorAll('.panel').forEach(p=>{
    p.className = 'panel' + (p.id === id ? ' active' : '') + (p.id === 'panelSuccess' ? ' success' : '');
  });
}

function goToDashboard(uid){
  sessionStorage.setItem('axon_user_id', uid);
  showPanel('panelSuccess');
  setTimeout(()=>{ window.location.href = `axon-account.html?uid=${uid}`; }, 1100);
}

// ===== تبديل التبويبات =====
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=> t.className = 'tab');
    tab.className = 'tab active';
    const map = { password:'panelPassword', biometric:'panelBiometric', qr:'panelQr' };
    showPanel(map[tab.dataset.tab]);
  });
});

// ===== كلمة السر =====
document.getElementById('btnPassword').addEventListener('click', async ()=>{
  const email = document.getElementById('pwEmail').value.trim();
  const password = document.getElementById('pwPassword').value;
  if(!email || !password){
    showMsg('msgPassword', t('err_missing_fields'), 'err');
    return;
  }
  const btn = document.getElementById('btnPassword');
btn.disabled = true; btn.textContent = 'جاري التحقق...';

try{
  btn.textContent = t('checking_label');  
    const res = await fetch(fn('login-password'), {
      method:'POST', headers: headers(),
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if(data.success){
      goToDashboard(data.user_id);
      return;
    }
    if(data.locked){
  showMsg('msgPassword', data.error, 'err');
  return;
}

if(data.suggest_next_method === 'biometric'){
  showMsg('msgPassword', t('err_redirect_biometric'), 'err');
  document.getElementById('bioEmail').value = email;
  setTimeout(()=>{
    document.querySelectorAll('.tab').forEach(t=> t.className = 'tab');
    document.querySelector('.tab[data-tab="biometric"]').className = 'tab active';
    showPanel('panelBiometric');
  }, 1400);
  return;
}

const attemptsMsg = (typeof data.attempts_left === 'number')
? ` ${t('attempts_left').replace('{n}', data.attempts_left)}`   
  : '';
showMsg('msgPassword', t('err_wrong_password') + attemptsMsg, 'err');
  }catch(e){
    showMsg('msgPassword', t('err_server'), 'err');
  }finally{
    btn.disabled = false; btn.textContent = t('login_button');
  }
});

// ===== البصمة (بالإيميل) =====
document.getElementById('btnBiometric').addEventListener('click', async ()=>{
  const email = document.getElementById('bioEmail').value.trim();
  if(!email){
    showMsg('msgQr', t('err_missing_email'), 'err');
    return;
  }
  const btn = document.getElementById('btnBiometric');
  btn.disabled = true; btn.textContent = t('checking_label');

  try{
    if(!window.PublicKeyCredential){
      showMsg('msgBiometric','هذا الجهاز/المتصفح لا يدعم البصمة (WebAuthn).','err');
      return;
    }

    const optRes = await fetch(fn('login-biometric-options'), {
      method:'POST', headers: headers(),
      body: JSON.stringify({ email })
    });
    const options = await optRes.json();
    if(options.error){
      showMsg('msgBiometric', options.error, 'err');
      return;
    }

    const userId = options.user_id;
    const authResp = await SimpleWebAuthnBrowser.startAuthentication(options);

    const verifyRes = await fetch(fn('login-biometric-verify'), {
      method:'POST', headers: headers(),
      body: JSON.stringify({ user_id: userId, assertion_response: authResp })
    });
    const verifyData = await verifyRes.json();

    if(verifyData.success){
      goToDashboard(userId);
      return;
    }
   showMsg('msgBiometric', verifyData.error || t('err_biometric_failed'), 'err'); 
  }catch(e){
    showMsg('msgBiometric', t('err_biometric_start_failed'), 'err');
  }finally{
    btn.disabled = false; btn.textContent = t('biometric_button');
  }
});

// ===== QR =====
let qrPollTimer = null;
let qrCountdownTimer = null;

document.getElementById('btnQrGenerate').addEventListener('click', async ()=>{
  const email = document.getElementById('qrEmail').value.trim();
  if(!email){
    showMsg('msgQr', t('err_missing_email'), 'err');
    return;
  }
  const btn = document.getElementById('btnQrGenerate');
  btn.disabled = true; btn.textContent = t('generating_label');

  try{
    const res = await fetch(fn('login-qr-generate'), {
      method:'POST', headers: headers(),
      body: JSON.stringify({ email })
    });
    const data = await res.json();

    if(data.error){
      showMsg('msgQr', data.error, 'err');
      return;
    }

    const qrHolder = document.getElementById('qrTokenDisplay');
    
qrHolder.innerHTML = '';

const confirmUrl = `https://axon-systeme.github.io/axon-login/axon-qr-confirm.html?token=${data.token}`;

qrHolder.innerHTML = `
  <img src="https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=${encodeURIComponent(confirmUrl)}"
       width="260" height="260"
       style="background:#fff; padding:10px; border-radius:8px; display:block; margin:0 auto;">
  <div style="margin-top:14px; font-size:0.85rem; color:var(--slate);">
   ${t('qr_open_link')} 
  </div>
  <a href="${confirmUrl}" target="_blank"
     style="display:block; word-break:break-all; font-size:0.8rem; color:var(--brass-bright); margin-top:6px; text-decoration:underline;">
    ${confirmUrl}
  </a>
`;

startQrCountdown(data.expires_in_seconds);
startQrPoll(data.token);
  }catch(e){
    showMsg('msgQr', `تعذر الاتصال بالسيرفر: ${e.name || ''} — ${e.message || 'غير معروف'}`, 'err');
  }finally{
    btn.disabled = false; btn.textContent = t('qr_button');
  }
});

function startQrPoll(token){
  clearInterval(qrPollTimer);
  qrPollTimer = setInterval(async ()=>{
    try{
      const res = await fetch(fn('qr-login-status'), {
        method:'POST', headers: headers(),
        body: JSON.stringify({ token })
      });
      const data = await res.json();

      if(data.status === 'confirmed'){
        clearInterval(qrPollTimer);
        clearInterval(qrCountdownTimer);
        showMsg('msgQr','تم تأكيد الدخول ✅','ok');
        goToDashboard(data.user_id);
        return;
      }
      if(data.status === 'expired'){
        clearInterval(qrPollTimer);
        showMsg('msgQr', t('qr_expired'), 'err'); 
      }
    }catch(e){ /* تجاهل أخطاء الفحص المؤقتة */ }
  }, 2500);
}

function startQrCountdown(seconds){
  clearInterval(qrCountdownTimer);
  let remaining = seconds;
  const timerEl = document.getElementById('qrTimer');
  timerEl.textContent = t('qr_expires_in').replace('{n}', remaining);
  qrCountdownTimer = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      clearInterval(qrCountdownTimer);
      clearInterval(qrPollTimer);
      timerEl.textContent = t('qr_expired');
      return;
    }
    timerEl.textContent = t('qr_expires_in').replace('{n}', remaining);
  }, 1000);
}
  function applyLanguage(lang){
      const dict = translations[lang];
      document.documentElement.dir = dict.dir;
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el=>{
        const key = el.getAttribute('data-i18n');
        if(dict[key]) el.textContent = dict[key];
      });
      localStorage.setItem('axon_lang', lang);
    }
const savedLang = localStorage.getItem('axon_lang') || 'ar';
document.getElementById('langSelect').value = savedLang;
applyLanguage(savedLang);

document.getElementById('langSelect').addEventListener('change', (e)=>{
  applyLanguage(e.target.value);
});
</script>

function getChatLang(){
  return localStorage.getItem('axon_lang') || 'ar';
}

function renderAxonChat(nodeKey, userLabel){
      const lang = getChatLang();
      const qa = AXON_QA_ALL[lang] || AXON_QA_ALL.ar;
      const node = qa[nodeKey];
      document.querySelector('.axon-chat-header span').textContent = qa.header;
      const body = document.getElementById('axonChatBody');
      if(userLabel){
        body.insertAdjacentHTML('beforeend', `<div class="axon-chat-msg user">${userLabel}</div>`);
      }
      body.insertAdjacentHTML('beforeend', `
        <div class="axon-chat-msg">${node.msg}</div>
        <div class="axon-chat-options">
          ${node.options.map(o => `<button class="axon-chat-opt" data-next="${o.next}" data-label="${o.label}">${o.label}</button>`).join('')}
        </div>
      `);
      body.querySelectorAll('.axon-chat-opt').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          body.querySelectorAll('.axon-chat-options').forEach(el=>el.remove());
          renderAxonChat(btn.dataset.next, btn.dataset.label);
        });
      });
      body.scrollTop = body.scrollHeight;
    }
document.getElementById('axonChatFab').addEventListener('click', ()=>{
  document.getElementById('axonChatPanel').classList.add('open');
  renderAxonChat('start');
});
document.getElementById('axonChatClose').addEventListener('click', ()=>{
  document.getElementById('axonChatPanel').classList.remove('open');
});
</script>
