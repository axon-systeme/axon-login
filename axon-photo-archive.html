<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXON — أرشفة بالصورة</title>
<style>
  :root{
    --ink:#0f1420; --ink-2:#161d2e; --ink-3:#232c42;
    --slate:#8a93a8; --white:#e8ebf3; --gold:#c9a15a; --green:#3fa66f; --err:#e07a6b;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--white);font-family:'Segoe UI',Tahoma,Arial,sans-serif;padding:20px 14px 80px;}
  h1{text-align:center;font-size:1.3rem;margin:0 0 20px;}
  .card{background:var(--ink-2);border:1px solid var(--ink-3);border-radius:10px;padding:16px;margin-bottom:16px;max-width:600px;margin-left:auto;margin-right:auto;}
  label{display:block;font-size:0.82rem;color:var(--slate);margin-bottom:6px;}
  select, input, textarea{
    width:100%;padding:10px;border-radius:8px;border:1px solid var(--ink-3);
    background:var(--ink);color:var(--white);font-size:0.95rem;margin-bottom:14px;
  }
  .photo-box{
    border:2px dashed var(--gold);border-radius:10px;padding:20px;text-align:center;
    cursor:pointer;margin-bottom:14px;
  }
  .photo-box img{max-width:100%;border-radius:8px;margin-top:10px;}
  .fp-btn{
    width:100%;padding:14px;border:none;border-radius:8px;
    background:linear-gradient(135deg,#3b6fd6,#5a8ef0);color:#fff;
    font-size:1rem;font-weight:600;cursor:pointer;
  }
  .fp-btn:disabled{opacity:0.5;}
  .msg{text-align:center;padding:12px;border-radius:8px;margin-top:12px;font-size:0.9rem;display:none;}
  .msg.ok{display:block;background:rgba(63,166,111,.15);color:#7bd6a4;}
  .msg.err{display:block;background:rgba(224,122,107,.15);color:var(--err);}
  .confirm-box{
    background:var(--ink-3);border-radius:8px;padding:14px;margin-top:14px;font-size:0.85rem;line-height:1.8;
  }
</style>
</head>
<body>

<h1>AXON — أرشفة الفاتورة بالصورة</h1>

<div class="card">
  <label>الحساب (الجهة)</label>
  <select id="accountSelect"><option value="">جاري تحميل الحسابات...</option></select>

  <label>صورة الفاتورة</label>
  <div class="photo-box" id="photoBox">
    <span id="photoLabel">اضغط هنا لالتقاط أو اختيار صورة</span>
    <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">
    <img id="photoPreview" style="display:none">
  </div>

  <label>ملاحظة (اختياري)</label>
  <textarea id="noteInput" rows="2" placeholder="مثال: فاتورة مواد غذائية شهر 09"></textarea>

  <button class="fp-btn" id="confirmBtn">🔒 تأكيد الأرشفة ببصمة اليد</button>
  <div class="msg" id="msgBox"></div>
</div>

<script src="https://unpkg.com/@simplewebauthn/browser@10/dist/bundle/index.umd.min.js"></script>
<script>
const SB_URL = "https://tmizzjieyeqbcxuxoucw.supabase.co";
const SB_KEY = "sb_publishable_0MXFCqGL0eqkteVozjLtDQ_VCmGeXhM";
const H = { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json" };

const currentPersonId = localStorage.getItem('axon_person_id');
const currentPersonEmail = localStorage.getItem('axon_email');

let selectedFile = null;

document.getElementById('photoBox').addEventListener('click', ()=>{
  document.getElementById('photoInput').click();
});

document.getElementById('photoInput').addEventListener('change', function(e){
  selectedFile = e.target.files[0];
  if(selectedFile){
    const reader = new FileReader();
    reader.onload = function(ev){
      document.getElementById('photoPreview').src = ev.target.result;
      document.getElementById('photoPreview').style.display = 'block';
      document.getElementById('photoLabel').textContent = 'اضغط لتغيير الصورة';
    };
    reader.readAsDataURL(selectedFile);
  }
});

async function loadAccounts(){
  const sel = document.getElementById('accountSelect');
  try{
    const res = await fetch(`${SB_URL}/rest/v1/accounts?select=id,name`, { headers: H });
    const data = await res.json();
    sel.innerHTML = '<option value="">اختر الحساب...</option>';
    data.forEach(a=>{
      const opt = document.createElement('option');
      opt.value = a.id;
      opt.textContent = a.name;
      sel.appendChild(opt);
    });
  }catch(e){
    sel.innerHTML = '<option value="">تعذر التحميل</option>';
  }
}
loadAccounts();

document.getElementById('confirmBtn').addEventListener('click', async function(){
  const btn = this;
  const msgBox = document.getElementById('msgBox');
  msgBox.className = 'msg';

  const accountId = document.getElementById('accountSelect').value;
  const note = document.getElementById('noteInput').value.trim();

  if(!accountId){
    msgBox.className = 'msg err';
    msgBox.textContent = 'اختر الحساب أولاً.';
    return;
  }
  if(!selectedFile){
    msgBox.className = 'msg err';
    msgBox.textContent = 'أضف صورة الفاتورة أولاً.';
    return;
  }
  if(!currentPersonEmail){
    msgBox.className = 'msg err';
    msgBox.textContent = 'تعذر التعرف على المستخدم الحالي. سجّل الدخول من جديد.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'جاري التحقق من البصمة...';

  try{
    const optRes = await fetch(`${SB_URL}/functions/v1/login-biometric-options`, {
      method:'POST', headers: H, body: JSON.stringify({ email: currentPersonEmail })
    });
    const options = await optRes.json();

    const assertion = await SimpleWebAuthnBrowser.startAuthentication(options);

    const verifyRes = await fetch(`${SB_URL}/functions/v1/login-biometric-verify`, {
      method:'POST', headers: H, body: JSON.stringify({ email: currentPersonEmail, assertion })
    });
    const verifyData = await verifyRes.json();
    if(!verifyData.verified){
      throw new Error('فشل التحقق من البصمة.');
    }

    btn.textContent = 'جاري رفع الصورة...';
    const fileName = `${accountId}/${Date.now()}_${selectedFile.name}`;
    const uploadRes = await fetch(`${SB_URL}/storage/v1/object/invoice-photos/${fileName}`, {
      method:'POST',
      headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": selectedFile.type },
      body: selectedFile
    });
    if(!uploadRes.ok){
      throw new Error('فشل رفع الصورة.');
    }

    const insertRes = await fetch(`${SB_URL}/rest/v1/photo_archive`, {
      method:'POST',
      headers: { ...H, "Prefer": "return=representation" },
      body: JSON.stringify({
        account_id: accountId,
        archived_by: currentPersonId,
        image_path: fileName,
        note: note || null
      })
    });
    const insertData = await insertRes.json();
    if(!Array.isArray(insertData) || insertData.length === 0){
      throw new Error('فشل تسجيل الأرشفة.');
    }

    const savedAt = new Date(insertData[0].created_at);
    msgBox.className = 'msg ok';
    msgBox.innerHTML = `تمت الأرشفة بنجاح ✅
      <div class="confirm-box">
        المؤرشف: ${currentPersonEmail}<br>
        الوقت: ${savedAt.toLocaleTimeString('ar')}<br>
        التاريخ: ${savedAt.toLocaleDateString('ar')}<br>
        لا يمكن تعديل أو حذف هذا السجل نهائيًا.
      </div>`;

    selectedFile = null;
    document.getElementById('photoPreview').style.display = 'none';
    document.getElementById('photoLabel').textContent = 'اضغط هنا لالتقاط أو اختيار صورة';
    document.getElementById('noteInput').value = '';

  }catch(e){
    msgBox.className = 'msg err';
    msgBox.textContent = 'خطأ: ' + e.message;
  }finally{
    btn.disabled = false;
    btn.textContent = '🔒 تأكيد الأرشفة ببصمة اليد';
  }
});
</script>

</body>
</html>
