<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXON — لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14171c; --ink-2:#1b1f26; --ink-3:#232833;
    --brass:#b08d57; --brass-bright:#d4ac6e;
    --paper:#ece7dc; --slate:#7d8493;
    --ok:#5c9179; --err:#b0654f; --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(1200px 800px at 50% -10%, #1e2430 0%, var(--ink) 55%), var(--ink);
    color:var(--paper); font-family:'IBM Plex Sans Arabic', sans-serif;
    min-height:100vh; padding:24px 16px 60px; -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:520px; margin:0 auto; }
  header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .brand{ font-family:'Zilla Slab', serif; font-weight:700; font-size:1.4rem; }
  .brand span{ color:var(--brass-bright); }
  .logout{ font-size:0.78rem; color:var(--slate); border:1px solid var(--ink-3); padding:7px 12px; border-radius:8px; cursor:pointer; background:none; font-family:inherit; }
  .logout:hover{ border-color:var(--brass); color:var(--paper); }

  .card{
    background:var(--ink-2); border:1px solid var(--ink-3); border-radius:var(--radius);
    padding:20px; margin-bottom:16px; box-shadow:0 12px 30px -18px rgba(0,0,0,.5);
  }
  .card h2{ font-family:'Zilla Slab', serif; font-size:1.05rem; margin-bottom:4px; }
  .card .sub{ font-size:0.78rem; color:var(--slate); margin-bottom:14px; }

  .profile-row{ display:flex; align-items:center; gap:12px; }
  .avatar{ width:44px; height:44px; border-radius:50%; background:linear-gradient(180deg,var(--brass-bright),var(--brass)); display:flex; align-items:center; justify-content:center; font-weight:700; color:#14171c; flex-shrink:0; }
  .profile-info .email{ font-weight:600; font-size:0.95rem; }
  .profile-info .role{ font-size:0.75rem; color:var(--slate); margin-top:2px; }

  .list-item{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--ink-3); font-size:0.85rem; }
  .list-item:last-child{ border-bottom:none; }
  .list-item .name{ font-weight:600; }
  .list-item .meta{ color:var(--slate); font-size:0.72rem; }
  .badge{ font-size:0.68rem; padding:3px 8px; border-radius:20px; font-family:'IBM Plex Mono',monospace; }
  .badge.granted{ background:rgba(92,145,121,.15); color:#9fd2b8; }
  .badge.denied{ background:rgba(176,101,79,.15); color:#e3a794; }
  .badge.locked{ background:rgba(176,141,87,.15); color:var(--brass-bright); }

  .empty{ font-size:0.82rem; color:var(--slate); text-align:center; padding:14px 0; }

  .field{ margin-bottom:10px; }
  .field input{
    width:100%; background:var(--ink); border:1px solid var(--ink-3); border-radius:9px;
    padding:10px 12px; color:var(--paper); font-family:inherit; font-size:0.9rem;
  }
  .field input:focus{ outline:none; border-color:var(--brass); }
  .btn{
    width:100%; padding:11px; border-radius:9px; border:none; font-weight:600;
    font-family:inherit; font-size:0.88rem; cursor:pointer;
    background:linear-gradient(180deg, var(--brass-bright), var(--brass)); color:#14171c;
  }
  .btn:active{ transform:scale(.98); }
  .msg{ margin-top:10px; font-size:0.78rem; padding:8px 10px; border-radius:7px; display:none; }
  .msg.show{ display:block; }
  .msg.ok{ background:rgba(92,145,121,.14); color:#9fd2b8; }
  .msg.err{ background:rgba(176,101,79,.14); color:#e3a794; }

  .loading{ text-align:center; color:var(--slate); font-size:0.85rem; padding:30px 0; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">AX<span>ON</span> — لوحة التحكم</div>
    <button class="logout" id="btnLogout">خروج</button>
  </header>

  <div id="loadingState" class="loading">جاري تحميل بياناتك...</div>

  <div id="content" style="display:none;">

    <div class="card">
      <div class="profile-row">
        <div class="avatar" id="avatarLetter">A</div>
        <div class="profile-info">
          <div class="email" id="profileEmail">—</div>
          <div class="role" id="profileRole">—</div>
        </div>
      </div>
    </div>

    <div class="card" data-module="children">
      <h2>ملفات الأطفال</h2>
      <div class="sub">الأطفال المسجّلون تحت حسابك كولي أمر.</div>
      <div id="childrenList"></div>

      <div style="margin-top:14px;">
        <div class="field"><input type="text" id="childName" placeholder="اسم الطفل"></div>
        <div class="field"><input type="number" id="childYear" placeholder="سنة الميلاد (اختياري)"></div>
        <button class="btn" id="btnAddChild">إضافة طفل</button>
        <div class="msg" id="msgChild"></div>
      </div>
    </div>

   <div class="card" data-module="logs"> 
      <h2>آخر عمليات الدخول</h2>
      <div class="sub">آخر 8 محاولات دخول على حسابك.</div>
      <div id="logsList"></div>
    </div>

   <div class="card" data-module="alerts"> 
      <h2>تنبيهات الطوارئ</h2>
      <div class="sub">أي تنبيهات نشطة أو سابقة على حسابك.</div>
      <div id="alertsList"></div>
    </div>

  </div>
</div>

<script>
const SUPABASE_URL = "https://tmizzjieyeqbcxuxoucw.supabase.co";
const ANON_KEY = "sb_publishable_0MXFCqGL0eqkteVozjLtDQ_VCmGeXhM";

const params = new URLSearchParams(window.location.search);
let userId = params.get('uid') || sessionStorage.getItem('axon_user_id');

if(!userId){
  window.location.href = 'axon-login-2.html';
}
const MODULES = {
  family:    ['children', 'logs', 'alerts'],
  company:   ['logs'],
  education: ['logs'],
  school:    ['logs'],
  cafeteria: ['logs'],
  archive:   ['logs'],
};
function allowedModules(org){
  const key = org && (org.sector || org.org_type);
  return MODULES[key] || ['logs'];
}
function applyModules(allowed){
  document.querySelectorAll('[data-module]').forEach(el=>{
    el.style.display = allowed.includes(el.dataset.module) ? '' : 'none';
  });
}
function restHeaders(){
  return {
    "apikey": ANON_KEY,
    "Authorization": `Bearer ${ANON_KEY}`,
    "Content-Type": "application/json"
  };
}
async function restGet(path){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: restHeaders() });
  if(!res.ok) return [];
  return res.json();
}
async function restPost(table, body){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method:'POST',
    headers: { ...restHeaders(), "Prefer":"return=representation" },
    body: JSON.stringify(body)
  });
  return res.json();
}

function timeAgo(iso){
  const d = new Date(iso);
  return d.toLocaleString('ar', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}

async function loadDashboard(){
  const user = await restGet(`users?id=eq.${userId}&select=email,role,organization_id`);
  if(!user.length){
    document.getElementById('loadingState').textContent = 'تعذّر العثور على الحساب.';
    return;
  }
  const u = user[0];
  document.getElementById('profileEmail').textContent = u.email;
  document.getElementById('profileRole').textContent = u.role === 'parent' ? 'ولي أمر' : (u.role === 'admin' ? 'مسؤول' : 'مستخدم');
  document.getElementById('avatarLetter').textContent = u.email.charAt(0).toUpperCase();

  const orgRows = u.organization_id
    ? await restGet(`organizations?id=eq.${u.organization_id}&select=org_type,sector`)
    : [];
  const allowed = allowedModules(orgRows[0]);
  applyModules(allowed);

  if(allowed.includes('children')){
    const children = await restGet(`children_profiles?parent_user_id=eq.${userId}&select=id,display_name,birth_year&order=created_at.desc`);
    renderChildren(children);
  }
  if(allowed.includes('logs')){
    const logs = await restGet(`access_logs?user_id=eq.${userId}&select=status,method,attempted_at&order=attempted_at.desc&limit=8`);
    renderLogs(logs);
  }
  if(allowed.includes('alerts')){
    const alerts = await restGet(`emergency_alerts?user_id=eq.${userId}&select=alert_type,status,created_at&order=created_at.desc&limit=5`);
    renderAlerts(alerts);
  }

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}

function renderChildren(list){
  const el = document.getElementById('childrenList');
  if(!list.length){ el.innerHTML = '<div class="empty">لا يوجد أطفال مسجّلون بعد.</div>'; return; }
  el.innerHTML = list.map(c => `
    <div class="list-item">
      <div><div class="name">${c.display_name}</div>${c.birth_year ? `<div class="meta">مواليد ${c.birth_year}</div>` : ''}</div>
    </div>
  `).join('');
}

function renderLogs(list){
  const el = document.getElementById('logsList');
  if(!list.length){ el.innerHTML = '<div class="empty">لا يوجد سجل دخول بعد.</div>'; return; }
  const methodAr = { password:'كلمة السر', biometric:'البصمة', qr:'QR', account_locked:'قفل الحساب' };
  el.innerHTML = list.map(l => `
    <div class="list-item">
      <div><div class="name">${methodAr[l.method] || l.method || '—'}</div><div class="meta">${timeAgo(l.attempted_at)}</div></div>
      <span class="badge ${l.status === 'granted' ? 'granted' : 'denied'}">${l.status === 'granted' ? 'ناجح' : 'مرفوض'}</span>
    </div>
  `).join('');
}

function renderAlerts(list){
  const el = document.getElementById('alertsList');
  if(!list.length){ el.innerHTML = '<div class="empty">لا توجد تنبيهات.</div>'; return; }
  el.innerHTML = list.map(a => `
    <div class="list-item">
      <div><div class="name">${a.alert_type}</div><div class="meta">${timeAgo(a.created_at)}</div></div>
      <span class="badge ${a.status === 'active' ? 'locked' : 'granted'}">${a.status}</span>
    </div>
  `).join('');
}

document.getElementById('btnAddChild').addEventListener('click', async ()=>{
  const name = document.getElementById('childName').value.trim();
  const year = document.getElementById('childYear').value.trim();
  if(!name){
    showMsgChild('اكتب اسم الطفل أولًا.', 'err');
    return;
  }
  try{
    const body = { parent_user_id: userId, display_name: name };
    if(year) body.birth_year = parseInt(year);
    await restPost('children_profiles', body);
    showMsgChild('تمت الإضافة بنجاح.', 'ok');
    document.getElementById('childName').value = '';
    document.getElementById('childYear').value = '';
    const children = await restGet(`children_profiles?parent_user_id=eq.${userId}&select=id,display_name,birth_year&order=created_at.desc`);
    renderChildren(children);
  }catch(e){
    showMsgChild('حدث خطأ أثناء الإضافة.', 'err');
  }
});

function showMsgChild(text, type){
  const el = document.getElementById('msgChild');
  el.textContent = text;
  el.className = 'msg show ' + type;
  setTimeout(()=>{ el.className = 'msg'; }, 3000);
}

document.getElementById('btnLogout').addEventListener('click', ()=>{
  sessionStorage.removeItem('axon_user_id');
  sessionStorage.removeItem('axon_user_email');
  window.location.href = 'axon-login-2.html';
});

loadDashboard();
</script>
</body>
</html>
