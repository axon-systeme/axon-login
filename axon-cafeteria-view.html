 <script>
function downloadPhoto(url){
  fetch(url).then(function(r){ return r.blob(); }).then(function(blob){
    var link = document.createElement('a');
    link.href = window.URL.createObjectURL(blob);
    link.download = 'فاتورة.jpg';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }).catch(function(e){ alert('تعذر التحميل: ' + e.message); });
}

function printPhoto(url){
  var win = window.open('', '_blank');
  win.document.write('<img src="' + url + '" style="max-width:100%" onload="window.print()">');
  win.document.close();
}

<script>
var URL = "https://tmizzjieyeqbcxuxoucw.supabase.co";
var KEY = "sb_publishable_0MXFCqGL0eqkteVozjLtDQ_VCmGeXhM";
var H = { "apikey": KEY, "Authorization": "Bearer " + KEY };

fetch(URL + "/rest/v1/resource_stock?category=eq.مطعم&select=*", { headers: H })
  .then(function(r){ return r.json(); })
  .then(function(d){
    var html = "<tr><th>المادة</th><th>الكمية</th><th>الوحدة</th><th>الدورية</th></tr>";
    d.forEach(function(r){
      html += "<tr><td>" + r.item_name + "</td><td>" + r.quantity + "</td><td>" + r.unit + "</td><td>" + r.frequency + "</td></tr>";
    });
    document.getElementById('stockTable').innerHTML = html;
  });

fetch(URL + "/rest/v1/assets?category=eq.مطعم&select=*", { headers: H })
  .then(function(r){ return r.json(); })
  .then(function(d){
    var html = "<tr><th>العنصر</th><th>العدد</th></tr>";
    d.forEach(function(a){
      html += "<tr><td>" + a.item_name + "</td><td>" + a.quantity + "</td></tr>";
    });
    document.getElementById('assetsTable').innerHTML = html;
  });

Promise.all([
  fetch(URL + "/rest/v1/accounts?select=id,name", { headers: H }).then(function(r){ return r.json(); }),
  fetch(URL + "/rest/v1/persons?select=id,full_name", { headers: H }).then(function(r){ return r.json(); }),
  fetch(URL + "/rest/v1/invoices?select=*,invoice_items(*)&order=created_at.desc", { headers: H }).then(function(r){ return r.json(); })
]).then(function(results){
  var accounts = results[0], persons = results[1], invoices = results[2];
  var accMap = {}; accounts.forEach(function(a){ accMap[a.id] = a.name; });
  var personMap = {}; persons.forEach(function(p){ personMap[p.id] = p.full_name; });

  var container = document.getElementById('invoicesArchive');
  if(!Array.isArray(invoices) || invoices.length === 0){
    container.innerHTML = "لا توجد فواتير محفوظة بعد.";
    return;
  }

  var html = "";
  invoices.forEach(function(inv){
    var accName = accMap[inv.account_id] || inv.account_id;
    var personName = personMap[inv.archived_by] || inv.archived_by;
    var date = inv.created_at ? new Date(inv.created_at).toLocaleDateString('ar') : "";

    html += "<div class='invoice-card'>";
    html += "<div class='invoice-head'><b>فاتورة رقم " + inv.invoice_number + "</b><span>" + date + "</span></div>";
    html += "<div class='invoice-meta'>الحساب: " + accName + " — أمين المخزن: " + personName + "</div>";

    html += "<table class='invoice-items-table'><tr><th>المادة</th><th>الوزن/الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th></tr>";
    (inv.invoice_items || []).forEach(function(it){
      html += "<tr><td>" + it.item_name + "</td><td>" + it.weight + "</td><td>" + it.unit_price + "</td><td>" + it.line_total + "</td></tr>";
    });
    html += "</table>";

    html += "<div class='invoice-total'>الإجمالي الكلي: " + inv.total_value + "</div>";
    html += "</div>";
  });
  container.innerHTML = html;
}).catch(function(e){
  document.getElementById('invoicesArchive').innerHTML = "تعذر تحميل الأرشيف: " + e.message;
});

  Promise.all([
  fetch(URL + "/rest/v1/accounts?select=id,name", { headers: H }).then(function(r){ return r.json(); }),
  fetch(URL + "/rest/v1/users?select=id,full_name,email", { headers: H }).then(function(r){ return r.json(); }),
  fetch(URL + "/rest/v1/photo_archive?select=*&order=created_at.desc", { headers: H }).then(function(r){ return r.json(); })
]).then(function(results){
  var accounts = results[0], users = results[1], photos = results[2];
  var accMap = {}; accounts.forEach(function(a){ accMap[a.id] = a.name; });
  var userMap = {}; users.forEach(function(u){ userMap[u.id] = u.full_name || u.email; });

  var container = document.getElementById('photoArchiveContainer');
  if(!Array.isArray(photos) || photos.length === 0){
    container.innerHTML = "لا توجد فواتير مؤرشفة بالصورة بعد.";
    return;
  }

  var html = "";
  var signPromises = [];

  photos.forEach(function(p, idx){
    var accName = accMap[p.account_id] || p.account_id;
    var archiverName = userMap[p.archived_by] || p.archived_by;
    var date = p.created_at ? new Date(p.created_at).toLocaleString('ar') : "";

    html += "<div class='invoice-card' id='photoCard" + idx + "'>";
    html += "<div class='invoice-head'><b>" + accName + "</b><span>" + date + "</span></div>";
    html += "<div class='invoice-meta'>المؤرشف: " + archiverName + (p.note ? " — " + p.note : "") + "</div>";
    html += "<div class='photo-wrap' id='photoImg" + idx + "'>جاري تحميل الصورة...</div>";
    html += "</div>";
var signPromise = fetch(URL + "/storage/v1/object/sign/invoice-photos/" + p.image_path, {
        method: 'POST', headers: Object.assign({}, H, {"Content-Type": "application/json"}), body: JSON.stringify({ expiresIn: 3600 })
      }).then(function(r){ return r.json(); }).then(function(signData){
        return { idx: idx, url: "/storage/v1" + signData.signedURL, err: JSON.stringify(signData) };
      });
      signPromises.push(signPromise);
    });

    container.innerHTML = html;

  Promise.all(signPromises).then(function(signResults){
    signResults.forEach(function(sr){
     var el = document.getElementById('photoImg' + sr.idx);
        if(sr.url){
              var fullUrl = URL + sr.url;
              el.innerHTML = "<a href='" + fullUrl + "' target='_blank' style='color:#5b9bd5;margin-inline-end:16px;'>عرض</a>" +
                "<span onclick='downloadPhoto(\"" + fullUrl + "\")' style='color:#5b9bd5;cursor:pointer;margin-inline-end:16px;'>تحميل</span>" +
                "<span onclick='printPhoto(\"" + fullUrl + "\")' style='color:#5b9bd5;cursor:pointer;'>طباعة</span>";
            } else {
              el.innerHTML = "تعذر تحميل الصورة: " + sr.err;
            }
      });
  });
}).catch(function(e){
  document.getElementById('photoArchiveContainer').innerHTML = "تعذر تحميل الأرشيف بالصورة: " + e.message;
});
</script>
</body>
</html>
