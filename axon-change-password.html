<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXON — تغيير كلمة السر</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#14171c;color:#ece7dc;font-family:sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;}
  .card{background:#1b1f26;border:1px solid #232833;border-radius:14px;padding:24px;max-width:420px;width:100%;}
  h2{margin-bottom:6px;font-size:1.15rem;}
  p{font-size:0.82rem;color:#7d8493;margin-bottom:16px;}
  label{display:block;font-size:0.8rem;color:#7d8493;margin:12px 0 6px;}
  input{width:100%;background:#14171c;border:1px solid #232833;border-radius:9px;padding:11px 12px;color:#ece7dc;font-size:0.92rem;direction:ltr;}
  button{width:100%;margin-top:16px;padding:12px;border:none;border-radius:9px;font-weight:600;font-size:0.92rem;background:linear-gradient(135deg,#1a5fb4,#4a9eff);color:#fff;cursor:pointer;}
  button:disabled{opacity:.6;}
  #msg{margin-top:12px;font-size:0.8rem;padding:9px 11px;border-radius:8px;display:none;}
  #msg.err{display:block;background:rgba(176,101,79,.15);color:#e3a794;}
  #msg.ok{display:block;background:rgba(92,145,121,.15);color:#9fd2b8;}
</style>
</head>
<body>
<div class="card">
  <h2>تغيير كلمة السر</h2>
  <p>دخلت بكلمة سر مؤقتة. اختر كلمة جديدة يعرفها أنت فقط للمتابعة.</p>
  <label>كلمة السر المؤقتة</label>
  <input type="password" id="cur" autocomplete="current-password">
  <label>كلمة السر الجديدة (8 خانات على الأقل)</label>
  <input type="password" id="nw" autocomplete="new-password">
  <label>أعد كتابة كلمة السر الجديدة</label>
  <input type="password" id="nw2" autocomplete="new-password">
  <button id="btn">تغيير</button>
  <div id="msg"></div>
</div>
<script>
const SUPABASE_URL = "https://tmizzjieyeqbcxuxoucw.supabase.co";
const ANON_KEY = "sb_publishable_0MXFCqGL0eqkteVozjLtDQ_VCmGeXhM";
const token = sessionStorage.getItem('axon_pw_change_token');
if(!token){ location.href = 'axon-portal.html'; }
const $ = (id)=> document.getElementById(id);
function show(t, c){ const m = $('msg'); m.textContent = t; m.className = c; }
$('btn').addEventListener('click', async ()=>{
  const cur = $('cur').value, nw = $('nw').value, nw2 = $('nw2').value;
  if(!cur || !nw || !nw2){ show('عمّر كل الخانات.', 'err'); return; }
  if(nw.length < 8){ show('كلمة السر الجديدة لازم تكون 8 خانات على الأقل.', 'err'); return; }
  if(nw !== nw2){ show('كلمتا السر الجديدتان غير متطابقتين.', 'err'); return; }
  const btn = $('btn'); btn.disabled = true;
  try{
    const res = await fetch(`${SUPABASE_URL}/functions/v1/dynamic-service`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${ANON_KEY}`, 'apikey': ANON_KEY },
      body: JSON.stringify({ session_token: token, current_password: cur, new_password: nw })
    });
    const data = await res.json();
    if(data.success){
      sessionStorage.removeItem('axon_pw_change_token');
      show('تم تغيير كلمة السر. سجّل دخولك من جديد.', 'ok');
      setTimeout(()=>{ location.href = 'axon-portal.html'; }, 1500);
    }else{
      show(data.error || 'تعذر التغيير.', 'err');
      btn.disabled = false;
    }
  }catch(e){
    show('تعذر الاتصال بالسيرفر.', 'err');
    btn.disabled = false;
  }
});
</script>
</body>
</html>
